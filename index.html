<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Professional Tools</title>
    <style>
        /* عمومی ڈیزائن */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* کارڈ ڈیزائن */
        .card { background: #ffffff; border-radius: 15px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card h2 { text-align: center; color: #4a4a4a; margin-top: 0; font-size: 1.3rem; }
        
        /* ان پٹ باکسز */
        textarea, input[type="file"] { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 15px; font-size: 1rem; resize: vertical; }
        textarea:focus { border-color: #764ba2; outline: none; }
        
        /* بٹنز */
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; transition: 0.3s; font-weight: bold; min-width: 120px; }
        .btn-primary { background: linear-gradient(to right, #667eea, #764ba2); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-danger { background: #ffe6e6; color: #d63031; border: 1px solid #ffcccc; }
        .btn-danger:hover { background: #ffcccc; }
        .btn-download { background: #00b894; color: white; margin-top: 10px; display: none; }
        .btn-gallery { background: #dfe6e9; color: #2d3436; margin-bottom: 10px; display: block; width: 100%; text-align: center; }
        
        /* اسٹیٹس اور پری ویو */
        .status { text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; display: none; }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        
        .preview-box { text-align: center; margin-top: 15px; }
        .preview-box img, .preview-box audio { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
        
        /* ہدایات */
        .note { font-size: 0.8rem; color: #888; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. AI Image Generator -->
    <div class="card">
        <h2>🖼️ AI Image Generator</h2>
        <textarea id="imgPrompt" rows="2" placeholder="تصویر کی تفصیل لکھیں (مثلاً: ایک خوبصورت بلی)..."></textarea>
        
        <label class="btn btn-gallery">
            📁 Gallery سے تصویر اپلوڈ کریں
            <input type="file" id="imgUpload" accept="image/*" style="display: none;" onchange="previewImage(event)">
        </label>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="generateImage()">Generate Image</button>
            <button class="btn btn-danger" onclick="clearImage()">Remove / Clear</button>
        </div>
        
        <button class="btn btn-download" id="imgDownloadBtn" onclick="downloadImage()">⬇️ Download Image</button>
        <div class="status" id="imgStatus"></div>
        <div class="preview-box"><img id="imgPreview" src="" alt="Preview"></div>
    </div>

    <!-- 2. AI Voice Generator -->
    <div class="card">
        <h2>🎙️ AI Voice Generator</h2>
        <textarea id="voiceText" rows="3" placeholder="آواز میں تبدیل کرنے کے لیے متن لکھیں..."></textarea>
        
        <label class="btn btn-gallery">
            📁 Gallery سے آڈیو اپلوڈ کریں
            <input type="file" id="voiceUpload" accept="audio/*" style="display: none;" onchange="previewAudio(event)">
        </label>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="generateVoice()">Generate Voice</button>
            <button class="btn btn-danger" onclick="clearVoice()">Remove / Clear</button>
        </div>
        
        <button class="btn btn-download" id="voiceDownloadBtn" onclick="downloadVoice()">⬇️ Download Voice</button>
        <div class="status" id="voiceStatus"></div>
        <div class="preview-box"><audio id="voicePreview" controls></audio></div>
    </div>

    <!-- 3. AI Voice Remover -->
    <div class="card">
        <h2>🎵 AI Voice Remover</h2>
        <p style="text-align:center; font-size:0.9rem; color:#666;">آڈیو فائل اپلوڈ کریں اور بیک گراؤنڈ ہٹائیں</p>
        
        <label class="btn btn-gallery">
            📁 Gallery سے آڈیو منتخب کریں
            <input type="file" id="removerUpload" accept="audio/*" style="display: none;" onchange="previewRemover(event)">
        </label>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="processAudio()">Process Audio</button>
            <button class="btn btn-danger" onclick="clearRemover()">Remove / Clear</button>
        </div>
        
        <button class="btn btn-download" id="removerDownloadBtn" onclick="downloadRemover()">⬇️ Download Processed Audio</button>
        <div class="status" id="removerStatus"></div>
        <div class="preview-box"><audio id="removerPreview" controls></audio></div>
    </div>

    <div class="note">نوٹ: یہ ڈیمو ورژن ہے۔ اصلی AI نتائج کے لیے API Key درکار ہے۔</div>
</div>

<script>
    // --- 1. Image Generator Logic ---
    let currentImageUrl = null;

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('imgPreview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('imgDownloadBtn').style.display = 'block';
                document.getElementById('imgDownloadBtn').onclick = () => {
                    const a = document.createElement('a');
                    a.href = e.target.result;
                    a.download = 'uploaded_image.png';
                    a.click();
                };
            }
            reader.readAsDataURL(file);
        }
    }

    function generateImage() {
        const prompt = document.getElementById('imgPrompt').value;
        const status = document.getElementById('imgStatus');
        if (!prompt) { showStatus(status, 'error', 'براہ کرم تصویر کی تفصیل لکھیں'); return; }
        
        showStatus(status, 'success', 'تصویر بن رہی ہے... (ڈیمو موڈ)');
        
        // ڈیمو کے لیے ایک تصویر (اصل میں یہاں API کال ہوگی)
        setTimeout(() => {
            const imgUrl = 'https://picsum.photos/400/300?random=' + Math.random();
            const img = document.getElementById('imgPreview');
            img.src = imgUrl;
            img.style.display = 'block';
            currentImageUrl = imgUrl;
            
            const dlBtn = document.getElementById('imgDownloadBtn');
            dlBtn.style.display = 'block';
            dlBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = imgUrl;
                a.download = 'generated_image.jpg';
                a.click();
            };
            showStatus(status, 'success', '✅ تصویر کامیابی سے بن گئی!');
        }, 1500);
    }

    function clearImage() {
        document.getElementById('imgPrompt').value = '';
        const img = document.getElementById('imgPreview');
        img.src = ''; img.style.display = 'none';
        document.getElementById('imgDownloadBtn').style.display = 'none';
        document.getElementById('imgStatus').style.display = 'none';
    }

    // --- 2. Voice Generator Logic ---
    let currentVoiceUrl = null;

    function previewAudio(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            const audio = document.getElementById('voicePreview');
            audio.src = url;
            audio.style.display = 'block';
            currentVoiceUrl = url;
            document.getElementById('voiceDownloadBtn').style.display = 'block';
            document.getElementById('voiceDownloadBtn').onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = 'uploaded_audio.mp3';
                a.click();
            };
        }
    }

    function generateVoice() {
        const text = document.getElementById('voiceText').value;
        const status = document.getElementById('voiceStatus');
        if (!text) { showStatus(status, 'error', 'براہ کرم کچھ متن لکھیں'); return; }

        showStatus(status, 'success', 'آواز بن رہی ہے... (ڈیمو موڈ)');

        // ڈیمو کے لیے ایک آواز (اصل میں یہاں API کال ہوگی)
        setTimeout(() => {
            // ایک مفت ڈیمو آڈیو لنک
            const demoAudio = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
            const audio = document.getElementById('voicePreview');
            audio.src = demoAudio;
            audio.style.display = 'block';
            currentVoiceUrl = demoAudio;

            const dlBtn = document.getElementById('voiceDownloadBtn');
            dlBtn.style.display = 'block';
            dlBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = demoAudio;
                a.download = 'generated_voice.mp3';
                a.click();
            };
            showStatus(status, 'success', '✅ آواز کامیابی سے بن گئی!');
        }, 1500);
    }

    function clearVoice() {
        document.getElementById('voiceText').value = '';
        const audio = document.getElementById('voicePreview');
        audio.src = ''; audio.style.display = 'none';
        document.getElementById('voiceDownloadBtn').style.display = 'none';
        document.getElementById('voiceStatus').style.display = 'none';
    }

    // --- 3. Voice Remover Logic ---
    let currentRemoverUrl = null;

    function previewRemover(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            const audio = document.getElementById('removerPreview');
            audio.src = url;
            audio.style.display = 'block';
            currentRemoverUrl = url;
        }
    }

    function processAudio() {
        const fileInput = document.getElementById('removerUpload');
        const status = document.getElementById('removerStatus');
        
        if (!fileInput.files[0]) { showStatus(status, 'error', 'براہ کرم پہلے آڈیو اپلوڈ کریں'); return; }

        showStatus(status, 'success', 'آڈیو پروسیس ہو رہی ہے... (ڈیمو موڈ)');

        // ڈیمو کے لیے ہم اسی اپلوڈڈ آڈیو کو واپس دکھا رہے ہیں
        setTimeout(() => {
            const audio = document.getElementById('removerPreview');
            // اصل میں یہاں بیک گراؤنڈ ہٹانے والی API لگے گی
            const dlBtn = document.getElementById('removerDownloadBtn');
            dlBtn.style.display = 'block';
            dlBtn.onclick = () => {
                if(currentRemoverUrl) {
                    const a = document.createElement('a');
                    a.href = currentRemoverUrl;
                    a.download = 'processed_audio.mp3';
                    a.click();
                }
            };
            showStatus(status, 'success', '✅ آڈیو پروسیس ہو گئی! (ڈیمو)');
        }, 2000);
    }

    function clearRemover() {
        document.getElementById('removerUpload').value = '';
        const audio = document.getElementById('removerPreview');
        audio.src = ''; audio.style.display = 'none';
        document.getElementById('removerDownloadBtn').style.display = 'none';
        document.getElementById('removerStatus').style.display = 'none';
    }

    // --- ہیلپر فنکشن ---
    function showStatus(element, type, message) {
        element.className = 'status ' + type;
        element.innerText = message;
    }
</script>

</body>
      </html>
